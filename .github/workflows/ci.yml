# Verifies both halves on every push and pull request, and publishes a
# GitHub Release with the per-ABI APKs when a v* tag is pushed to main.
#
# The Flutter side builds and analyses on a Linux runner with the stable
# channel; the build output is uploaded as an artifact so the release job
# can attach the APKs without rebuilding. The Python side only checks that
# the package imports and the CLI parses its arguments - the index-dependent
# search path needs a 91 MB sqlite file that this repo does not store, and
# is exercised by the manual search command documented in README.md.
#
# develop is the long-lived line and can have its history rewritten; main is
# merged into only. A release is a tag of the form vX.Y.Z on main - pushing
# it verifies the same commit and runs the release job. PRs run the
# verification jobs but skip the release step.
name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build release APKs
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install osmium shapely numpy

      - name: Import check
        run: PYTHONPATH=mapidx python -c "from mapidx import build, cli, emit, obf, search, translit, vocab; print('imports ok')"

      - name: CLI help
        run: PYTHONPATH=mapidx python -m mapidx.cli --help

      - name: Test
        run: PYTHONPATH=mapidx python -m unittest discover tests -v

  release:
    needs: [flutter, python]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: app/build/app/outputs/flutter-apk/

      - name: Check the tag matches app/pubspec.yaml
        working-directory: app
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/^version: ([^+]+).*/\1/')
          if [ "v$VERSION" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match version $VERSION in pubspec.yaml"
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: ${{ github.ref }}
          generate_release_notes: true
          files: |
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            app/build/app/outputs/flutter-apk/app-x86_64-release.apk
